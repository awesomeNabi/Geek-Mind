<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGIC · Microduck 实时仿真</title>
<style>
:root{color-scheme:dark;--bg:#0c121b;--card:#141f2d;--line:#293749;--soft:#9badc3;--mint:#7de5bd;--amber:#f8cc7e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e9f1fb;font:15px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:20px 30px;border-bottom:1px solid var(--line)}h1{font-size:20px;letter-spacing:.06em;margin:0}h1 span{font-weight:400;color:var(--soft)}.badge{border:1px solid #37574d;border-radius:30px;padding:4px 14px;color:var(--mint)}main{max-width:1500px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}.label{padding:12px 18px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:600}.muted{color:var(--soft);font-size:13px;font-weight:400}.video{aspect-ratio:16/9;background:#080d14;position:relative}.video img{width:100%;height:100%;object-fit:contain}.offline{position:absolute;inset:0;display:grid;place-content:center;background:#0b111ddd;color:var(--amber);pointer-events:none}.offline.hidden{display:none}.body{padding:16px 18px}.telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.value{font:20px ui-monospace,monospace;color:var(--mint)}#goal{font-size:17px;white-space:pre-wrap;margin-bottom:14px}.step{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:12px}.step small{display:block;color:var(--soft)}.step b{color:var(--mint);font-size:12px;min-width:62px}.events{height:340px;overflow:auto;font:12px/1.75 ui-monospace,monospace;overflow-wrap:anywhere}.event{border-bottom:1px solid #233042;padding:7px 0}.event time{color:#778da9;margin-right:8px}.error{color:#ff9999}code{color:var(--amber)}footer{color:var(--soft);padding:0 24px 24px;max-width:1500px;margin:auto}button{background:#23394d;color:white;border:1px solid #3e566e;border-radius:6px;padding:4px 10px;cursor:pointer}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}header{padding:15px}.events{height:250px}}
</style>
<header><h1>MAGIC <span>/ MICRODUCK</span></h1><span id="phase" class="badge">连接中</span></header>
<main><section>
<div class="card"><div class="label">机器人本体 · 跟随视角 <span class="muted">真实仿真状态 · 墙体透明显示</span></div><div class="video"><img id="follow" alt="机器人第三人称实时视角"><div id="follow-off" class="offline">等待仿真画面…</div></div></div>
<div class="card"><div class="label">机器人头部相机 <span id="head-age" class="muted"></span></div><div class="video"><img id="head" alt="头部相机实时画面"><div id="head-off" class="offline">等待相机…</div></div></div>
</section><aside>
<div class="card"><div class="label">机器人状态 <span id="connection" class="muted">等待连接</span></div><div class="body telemetry"><div><div class="muted">X / 米</div><div id="x" class="value">—</div></div><div><div class="muted">Y / 米</div><div id="y" class="value">—</div></div><div><div class="muted">朝向 / 度</div><div id="yaw" class="value">—</div></div></div><div class="body" id="posture">—</div></div>
<div class="card"><div class="label">MAGIC 当前任务</div><div class="body"><div id="goal">在终端输入自然语言开始控制。</div><div id="plan"></div><p class="muted">在启动终端输入指令。<code>/stop</code> 停止任务，<code>/quit</code> 退出。</p></div></div>
<div class="card"><div class="label">实时事件 <button id="autoscroll">自动滚动：开</button></div><div class="body events" id="events"></div></div>
</aside></main><footer>当前为仿真。画面和状态来自运行中的机器人；此页面只读，控制指令在终端发送。</footer>
<script>
const $=id=>document.getElementById(id);
const phases={STARTING:'正在启动',READY:'等待指令',PLANNING:'MAGIC 规划中',EXECUTING:'正在执行',STOPPING:'正在停止',ERROR:'发生错误',CLOSED:'已关闭'};
const states={PENDING:'待执行',BLOCKED:'执行中',RUNNING:'执行中',VERIFYING:'验证中',SUCCEEDED:'已完成',FAILED:'失败',CANCELLED:'已取消',SKIPPED:'已跳过'};
let auto=true,lastEvent=0,session=null;const cameraFresh={}; $('autoscroll').onclick=()=>{auto=!auto;$('autoscroll').textContent='自动滚动：'+(auto?'开':'关');};
for(const view of ['follow','head']){const img=$(view); const connect=()=>img.src='/stream.mjpg?view='+view+'&t='+Date.now();img.onerror=()=>setTimeout(connect,1500);connect();}
async function refresh(){try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw Error(response.status);const s=await response.json();if(session!==s.session_id){session=s.session_id;lastEvent=0;$('events').replaceChildren();cameraFresh.head=cameraFresh.follow=false;}$('phase').textContent=phases[s.phase]||s.phase;
const r=s.robot||{},p=r.pose||{};$('connection').textContent=r.ready?'观测在线':'观测离线';$('x').textContent=p.x?.toFixed(3)??'—';$('y').textContent=p.y?.toFixed(3)??'—';$('yaw').textContent=p.yaw_degrees?.toFixed(1)??'—';$('posture').textContent='策略：'+(r.policy_state||'—')+'　导航：'+(r.navigation_available?'就绪':'不可用');$('goal').textContent=s.goal||'在终端输入自然语言开始控制。';
$('plan').replaceChildren(...s.plan.map(n=>{const row=document.createElement('div');row.className='step';const status=document.createElement('b');status.textContent=states[s.node_states[n.node_id]]||s.node_states[n.node_id]||'待执行';const label=document.createElement('div');label.textContent=n.skill;const args=document.createElement('small');args.textContent=JSON.stringify(n.arguments);label.append(args);row.append(status,label);return row;}));
for(const e of s.events){if(e.id<=lastEvent)continue;lastEvent=e.id;const row=document.createElement('div');row.className='event'+(e.kind==='error'?' error':'');const stamp=document.createElement('time');stamp.textContent=new Date(e.time*1000).toLocaleTimeString();row.append(stamp,document.createTextNode(e.text));$('events').append(row);while($('events').children.length>200)$('events').firstChild.remove();if(auto)$('events').scrollTop=$('events').scrollHeight;}
for(const view of ['head','follow']){const fresh=!!s.cameras[view]?.fresh;$(view+'-off').classList.toggle('hidden',fresh);if(fresh&&!cameraFresh[view])$(view).src='/stream.mjpg?view='+view+'&t='+Date.now();cameraFresh[view]=fresh;}$('head-age').textContent=s.cameras.head?'帧龄 '+Math.max(0,s.time-s.cameras.head.observed_at).toFixed(1)+' 秒':'等待相机';
}catch(e){$('phase').textContent='连接断开';$('connection').textContent='离线';for(const view of ['head','follow']){$(view+'-off').classList.remove('hidden');cameraFresh[view]=false;}}setTimeout(refresh,400);}refresh();
</script></html>
